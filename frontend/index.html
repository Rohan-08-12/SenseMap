<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preload" as="image" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SenseMap — Find places that feel right for you</title>
    <meta name="description" content="A community-powered sensory map helping autistic and sensory-sensitive individuals find comfortable public spaces. Real noise, lighting, and crowd ratings for Toronto." />
    <meta property="og:title" content="SenseMap — Find places that feel right for you" />
    <meta property="og:description" content="Community sensory ratings for noise, lighting, and crowds. Find calm spots in Toronto that match your needs." />
    <meta property="og:image" content="https://sensemap.app/og-image.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sensemap.app" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="SenseMap" />
    <meta name="twitter:description" content="Find calm, sensory-friendly places in Toronto." />
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('sensorysafe_theme');
          var theme = (stored === 'nature' || stored === 'calm') ? stored : 'nature';
          if (stored === 'night') theme = 'nature';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'nature');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
